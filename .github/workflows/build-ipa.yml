name: Build IPA

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = build if nxnative has a profile for the game, otherwise survey; survey = analyse only; build = pack the IPA"
        type: choice
        options:
          - auto
          - survey
          - build
        default: auto
      title_id:
        description: "Base game title ID (default: Super Mario Odyssey; Super Mario Bros. Wonder is 010015100B514000)"
        type: string
        default: "0100000000010000"
      nxnative_ref:
        description: "nxnative branch, tag or commit SHA (pin a SHA for reproducible builds)"
        type: string
        default: main
      nxnative_url:
        description: "nxnative repository the patches in patches/ were made against (the NXNATIVE-1.43.1 repository: nxnative with the 1.43:1 view and the controller work)"
        type: string
        default: "https://github.com/IMTHECOOLEST/NXNATIVE-1.43.1.git"
      apply_patches:
        description: "Apply patches/*.patch (the Odyssey touch layout) to nxnative before building"
        type: boolean
        default: true
      aspect_scan:
        description: "After the build, scan the extracted main NSO for 16:9 sites and write diagnostics/aspect-scan.txt"
        type: boolean
        default: true
      aspect_ratio:
        description: "Ratio for the aspect scan"
        type: string
        default: "1.43"
      runner:
        description: "Runner label. nxnative needs Xcode 27.1 (its shader tools are locked to that Metal compiler, and the app uses the iOS 27 SDK): xcode-27 is the image nxnative's own CI uses; macos-26 has an older Xcode. Use a larger or self-hosted Mac with Xcode 27.1 if the disk is too small"
        type: string
        default: xcode-27
      allow_other_metal:
        description: "Build even when the runner's Metal compiler is not the one nxnative locked. nxnative says such shaders can render wrong pictures (artifacts), so leave this off unless you accept that"
        type: boolean
        default: false
      app_name:
        description: "Home-screen app name (optional)"
        type: string
        default: ""
      allow_public:
        description: "Allow this run in a PUBLIC repository (standard macOS runners are free there). The IPA and diagnostics then go only to draft releases, never to artifacts"
        type: boolean
        default: false
      release_parts:
        description: "Also attach the IPA, split into parts under 2 GiB, to a draft release (an IPA of several GB often exceeds the artifact quota)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-ipa
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    permissions:
      contents: write   # only used to create the draft release holding the IPA parts
    steps:
      # The IPA embeds your game's files. Artifacts of public repositories can be downloaded by
      # anyone, so a public repository is refused unless allow_public is set; with it, the IPA
      # and the diagnostics are published only as DRAFT releases (visible to people with write
      # access to the repo) and the public artifact uploads below are skipped.
      - name: Check repository visibility
        id: vis
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_PUBLIC: ${{ inputs.allow_public }}
        run: |
          private="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)"
          echo "private=$private" >> "$GITHUB_OUTPUT"
          if [ "$private" != "true" ]; then
            if [ "$ALLOW_PUBLIC" != "true" ]; then
              echo "::error::This repository is public. Make it private, or run again with allow_public turned on (outputs then go only to draft releases)."
              exit 1
            fi
            echo "::notice::Public repository: the IPA and diagnostics go only to draft releases. This run's log is public, so it shows file names and build output."
          fi

      - uses: actions/checkout@v4

      - name: Build
        env:
          INPUT_ZIP_URL: ${{ secrets.INPUT_ZIP_URL }}
          INPUT_ZIP_SHA256: ${{ secrets.INPUT_ZIP_SHA256 }}
          OUTPUT_PUT_URL: ${{ secrets.OUTPUT_PUT_URL }}
          NXNATIVE_URL: ${{ inputs.nxnative_url }}
          NXNATIVE_REF: ${{ inputs.nxnative_ref }}
          APPLY_PATCHES: ${{ inputs.apply_patches && '1' || '0' }}
          ASPECT_SCAN: ${{ inputs.aspect_scan && '1' || '0' }}
          ASPECT_RATIO: ${{ inputs.aspect_ratio }}
          ALLOW_OTHER_METAL: ${{ inputs.allow_other_metal && '1' || '0' }}
          MODE: ${{ inputs.mode }}
          TITLE_ID: ${{ inputs.title_id }}
          APP_NAME: ${{ inputs.app_name }}
          WORK_DIR: ${{ runner.temp }}/smo-work
          OUT_DIR: ${{ runner.temp }}/smo-out
        run: bash scripts/cloud_build.sh

      - name: Summary
        if: always()
        run: |
          f="${{ runner.temp }}/smo-out/diagnostics/nxnative-commit.txt"
          if [ -f "$f" ]; then echo "nxnative commit: \`$(cat "$f")\`" >> "$GITHUB_STEP_SUMMARY"; fi
          p="${{ runner.temp }}/smo-out/diagnostics/profile-status.txt"
          if [ -f "$p" ]; then echo "$(cat "$p")" >> "$GITHUB_STEP_SUMMARY"; fi
          pt="${{ runner.temp }}/smo-out/diagnostics/patches.txt"
          if [ -f "$pt" ]; then { echo "patches:"; sed 's/^/- /' "$pt"; } >> "$GITHUB_STEP_SUMMARY"; fi
          ce="${{ runner.temp }}/smo-out/diagnostics/compile-errors.txt"
          if [ -s "$ce" ]; then { echo "compile errors (first 40 lines):"; echo '```'; head -n 40 "$ce"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          t="${{ runner.temp }}/smo-out/diagnostics/toolchain-lock.txt"
          if [ -f "$t" ]; then echo "shader tool lock, $(head -n 1 "$t")" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload diagnostics
        if: always() && steps.vis.outputs.private == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: ${{ runner.temp }}/smo-out/diagnostics
          retention-days: 3
          if-no-files-found: warn

      - name: Publish IPA parts (and, in a public repo, diagnostics) to draft releases
        if: always() && steps.vis.outcome == 'success' && (inputs.release_parts || steps.vis.outputs.private != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          DIAG_RELEASE: ${{ steps.vis.outputs.private != 'true' && '1' || '0' }}
        run: bash scripts/publish_release_parts.sh "${{ runner.temp }}/smo-out"

      - name: Upload IPA
        if: always() && steps.vis.outputs.private == 'true'
        continue-on-error: true   # a quota failure must not hide the other outputs
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ${{ runner.temp }}/smo-out/*.ipa
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
