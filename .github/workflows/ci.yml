name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: C tests (sanitizers)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -fsanitize=address,undefined \
            tests/test_ds_core.c dualsense/dm_ds_core.c -lm -o /tmp/test_ds_core
          /tmp/test_ds_core
      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done

  objc-syntax:
    # The Objective-C glue needs the iOS SDK, so it is checked on a Mac.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Compile-check against the iOS SDK
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -fsyntax-only -fobjc-arc -arch arm64 \
            -isysroot "$SDK" -miphoneos-version-min=16.0 -Wall \
            dualsense/DMDualSense.m
          xcrun --sdk iphoneos clang -fsyntax-only -std=c11 -arch arm64 \
            -isysroot "$SDK" -miphoneos-version-min=16.0 -Wall -Wextra -Werror \
            dualsense/dm_ds_core.c
